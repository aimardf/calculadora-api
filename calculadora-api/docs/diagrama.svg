<svg width="1100" height="420" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="a" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1d4ed8"/></marker>
<marker id="b" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#15803d"/></marker>
</defs>
<text x="550" y="34" font-size="22" font-weight="bold" text-anchor="middle">API Calculadora: recorrido de la petición y la respuesta</text>
<!-- Colab -->
<rect x="20" y="110" width="200" height="130" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="120" y="150" font-size="18" font-weight="bold" text-anchor="middle">Google Colab</text>
<text x="120" y="176" font-size="14" text-anchor="middle">notebook .ipynb</text>
<text x="120" y="198" font-size="14" text-anchor="middle">requests.get / .post</text>
<text x="120" y="222" font-size="12" text-anchor="middle" fill="#555">(cliente, en la nube)</text>
<!-- ngrok cloud -->
<rect x="300" y="110" width="200" height="130" rx="12" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
<text x="400" y="150" font-size="18" font-weight="bold" text-anchor="middle">ngrok (nube)</text>
<text x="400" y="176" font-size="13" text-anchor="middle">https://xxxx.ngrok-free.app</text>
<text x="400" y="198" font-size="14" text-anchor="middle">URL pública HTTPS</text>
<!-- PC frame -->
<rect x="560" y="60" width="520" height="300" rx="14" fill="#f8fafc" stroke="#475569" stroke-width="2" stroke-dasharray="8 5"/>
<text x="820" y="86" font-size="15" font-weight="bold" text-anchor="middle" fill="#475569">Mi ordenador (Windows)</text>
<rect x="580" y="110" width="150" height="130" rx="12" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
<text x="655" y="155" font-size="16" font-weight="bold" text-anchor="middle">agente ngrok</text>
<text x="655" y="180" font-size="13" text-anchor="middle">ngrok http 8000</text>
<rect x="780" y="100" width="280" height="160" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="920" y="124" font-size="15" font-weight="bold" text-anchor="middle">Contenedor Docker</text>
<text x="920" y="144" font-size="12" text-anchor="middle">-p 8000:8000</text>
<rect x="800" y="155" width="240" height="90" rx="10" fill="#fff" stroke="#1d4ed8"/>
<text x="920" y="180" font-size="15" font-weight="bold" text-anchor="middle">FastAPI + Uvicorn</text>
<text x="920" y="202" font-size="12" text-anchor="middle">GET /calcular/{operacion}</text>
<text x="920" y="220" font-size="12" text-anchor="middle">POST /calcular · /docs (Swagger)</text>
<rect x="780" y="285" width="280" height="55" rx="10" fill="#fff" stroke="#0f766e"/>
<text x="920" y="308" font-size="14" font-weight="bold" text-anchor="middle">Navegador: localhost:8000/docs</text>
<text x="920" y="328" font-size="12" text-anchor="middle">pruebas con Swagger UI</text>
<line x1="920" y1="285" x2="920" y2="248" stroke="#0f766e" stroke-width="2" stroke-dasharray="4 3"/>
<!-- request arrows -->
<line x1="220" y1="150" x2="298" y2="150" stroke="#1d4ed8" stroke-width="3" marker-end="url(#a)"/>
<line x1="500" y1="150" x2="578" y2="150" stroke="#1d4ed8" stroke-width="3" marker-end="url(#a)"/>
<line x1="730" y1="150" x2="798" y2="150" stroke="#1d4ed8" stroke-width="3" marker-end="url(#a)"/>
<text x="260" y="140" font-size="14" fill="#1d4ed8" text-anchor="middle">1</text>
<text x="540" y="140" font-size="14" fill="#1d4ed8" text-anchor="middle">2</text>
<text x="765" y="140" font-size="14" fill="#1d4ed8" text-anchor="middle">3</text>
<!-- response arrows -->
<line x1="798" y1="215" x2="732" y2="215" stroke="#15803d" stroke-width="3" marker-end="url(#b)"/>
<line x1="578" y1="215" x2="502" y2="215" stroke="#15803d" stroke-width="3" marker-end="url(#b)"/>
<line x1="298" y1="215" x2="222" y2="215" stroke="#15803d" stroke-width="3" marker-end="url(#b)"/>
<text x="765" y="235" font-size="14" fill="#15803d" text-anchor="middle">4</text>
<text x="540" y="235" font-size="14" fill="#15803d" text-anchor="middle">5</text>
<text x="260" y="235" font-size="14" fill="#15803d" text-anchor="middle">6</text>
<!-- legend -->
<line x1="30" y1="290" x2="80" y2="290" stroke="#1d4ed8" stroke-width="3" marker-end="url(#a)"/>
<text x="90" y="295" font-size="14">Petición HTTP (GET / POST)</text>
<line x1="30" y1="320" x2="80" y2="320" stroke="#15803d" stroke-width="3" marker-end="url(#b)"/>
<text x="90" y="325" font-size="14">Respuesta JSON</text>
<text x="30" y="360" font-size="13" fill="#333">1-3: Colab → ngrok → túnel → puerto 8000 del contenedor</text>
<text x="30" y="380" font-size="13" fill="#333">4-6: FastAPI calcula y devuelve {"resultado": ...} por el mismo camino</text>
</svg></body></html>
